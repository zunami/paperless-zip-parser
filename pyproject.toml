[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperless-zip-parser"
version = "1.1.0"
description = "Paperless-ngx parser that stores ZIP archives as one document, without unpacking them"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "paperless-zip-parser contributors" }]
keywords = ["paperless-ngx", "parser", "zip", "archive", "dms"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10", "bandit>=1.7"]

[project.urls]
Homepage = "https://github.com/"
Issues = "https://github.com/"

[project.entry-points."paperless_ngx.parsers"]
zip_archive = "paperless_zip_parser.parsers:ZipArchiveParser"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
